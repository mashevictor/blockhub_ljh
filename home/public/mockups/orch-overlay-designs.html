<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全屏编排 · 四种布局方案对比</title>
  <style>
    :root {
      --ink: #0f2a3d;
      --muted: #5a7285;
      --line: #d5e0e8;
      --paper: #f4f7f9;
      --card: #ffffff;
      --sea: #0d7a6f;
      --sea-soft: #e6f4f2;
      --amber: #c46b1a;
      --amber-soft: #fff4e8;
      --blue: #1a6bb5;
      --blue-soft: #e8f1fa;
      --ok: #1b8a4a;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(15, 42, 61, 0.12);
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #d8efe9 0%, transparent 55%),
        radial-gradient(700px 380px at 100% 0%, #dce8f5 0%, transparent 50%),
        var(--paper);
      min-height: 100vh;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -0.02em;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.5;
      font-size: 14px;
    }
    .pick-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(15, 42, 61, 0.06);
    }
    .pick-bar button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
    }
    .pick-bar button[aria-selected="true"] {
      background: var(--ink);
      color: #fff;
    }
    .compare-meta {
      margin: 16px 0 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 720px) {
      .compare-meta { grid-template-columns: 1fr; }
    }
    .meta-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
    }
    .meta-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .meta-card span { color: var(--muted); }
    .stage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 640px;
    }
    .stage-head {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfcfd, #fff);
      flex-wrap: wrap;
    }
    .app-id {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1a8f84, #0d5c55);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .app-id h2 {
      margin: 0 0 4px;
      font-size: 17px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .pill.warn { background: var(--amber-soft); color: var(--amber); border-color: #f0d2ad; }
    .pill.ok { background: #e8f7ee; color: var(--ok); border-color: #b9e4c8; }
    .head-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.primary {
      background: var(--sea);
      border-color: var(--sea);
      color: #fff;
    }
    .btn.ghost { background: transparent; }
    .body { padding: 16px 18px 22px; }
    .hidden { display: none !important; }

    /* shared mock bits */
    .progress {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: #e2ebf1;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 92%;
      background: linear-gradient(90deg, #148a7d, #1a6bb5);
    }
    .steps {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .steps li.done { color: var(--ok); }
    .steps li.active { color: var(--blue); font-weight: 600; }

    .cta-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 820px) {
      .cta-row { grid-template-columns: 1fr; }
    }
    .cta {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .cta.main {
      background: var(--sea-soft);
      border-color: #b7ddd7;
    }
    .cta h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }
    .cta p {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px 8px;
      border-radius: 9px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(15, 42, 61, 0.08);
    }
    .panel-note {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .dual {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      gap: 8px;
      min-height: 220px;
    }
    @media (max-width: 820px) {
      .dual { grid-template-columns: 1fr; }
      .bridge { display: none; }
    }
    .rail {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fafcfd;
    }
    .rail h4 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .node {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .node small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 11px;
    }
    .bridge {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
    }
    .api {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fff;
      font-size: 12px;
    }
    .tag {
      flex: none;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .tag.out { background: var(--amber-soft); color: var(--amber); }
    .api code {
      display: block;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      word-break: break-all;
      margin: 2px 0 6px;
    }
    .api-actions { display: flex; gap: 6px; }
    .api-actions .btn { padding: 5px 8px; font-size: 11px; }
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 820px) {
      .test-grid { grid-template-columns: 1fr; }
    }
    .test-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .test-card h4 { margin: 0 0 6px; font-size: 13px; }
    .test-card p { margin: 0 0 8px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge.real { background: #e8f7ee; color: var(--ok); }
    .badge.mock { background: var(--amber-soft); color: var(--amber); }
    .footer-pick {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .footer-pick p { margin: 0; font-size: 13px; opacity: 0.9; }
    .footer-pick .btn {
      background: #fff;
      color: var(--ink);
      border-color: #fff;
    }
    .split {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
      min-height: 360px;
    }
    @media (max-width: 820px) {
      .split { grid-template-columns: 1fr; }
    }
    .side {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--sea-soft);
    }
    .side h3 { margin: 0 0 10px; font-size: 14px; }
    .side .btn { width: 100%; justify-content: center; margin-bottom: 8px; }
    .ladder {
      display: grid;
      gap: 12px;
    }
    .layer {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }
    .layer > summary,
    .layer-head {
      padding: 12px 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafcfd;
    }
    .layer > summary::-webkit-details-marker { display: none; }
    .layer-body { padding: 12px 14px; border-top: 1px solid var(--line); }
    .hint { font-size: 11px; font-weight: 500; color: var(--muted); }
    .label-rec {
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--sea);
      color: #fff;
      font-weight: 700;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div>
        <h1>全屏编排 · 四种布局方案</h1>
        <p>
          场景：「通用办公·上海话语音」。原则：用户感知（打开、交付、试一下）置顶；
          编排与接口降级或用 Tab 分开。点上方方案切换预览，选定后告诉我 A/B/C/D。
        </p>
      </div>
      <div class="pick-bar" role="tablist" aria-label="方案选择">
        <button type="button" role="tab" aria-selected="true" data-plan="a">A 三 Tab</button>
        <button type="button" role="tab" aria-selected="false" data-plan="b">B 体验台</button>
        <button type="button" role="tab" aria-selected="false" data-plan="c">C 左右栏</button>
        <button type="button" role="tab" aria-selected="false" data-plan="d">D 阶梯层</button>
      </div>
    </div>

    <div class="compare-meta" id="meta">
      <!-- filled by JS -->
    </div>

    <div class="stage" id="stage">
      <!-- filled by JS -->
    </div>

    <div class="footer-pick">
      <p>选定后回复例如：<strong>选 A</strong>。我会按该方案改正式前端并升版本。</p>
      <button type="button" class="btn" id="copy-choice">复制当前方案代号</button>
    </div>
  </div>

  <script>
    const META = {
      a: {
        title: '方案 A · 三 Tab',
        pros: '信息分区最清晰；「使用与测试」独立放真接口 + 试运营。',
        cons: '编排与接口不在同一屏，调试时要切 Tab。',
        focus: '默认落在「使用与测试」',
      },
      b: {
        title: '方案 B · 体验台',
        pros: '第一眼只做完「能打开 / 能试」；编排在下面默认只看功能轨。',
        cons: '接口仍在第二层 Tab，开发向用户多点一次。',
        focus: '上方固定 CTA，下方 Tab：功能编排 | 数据接口',
      },
      c: {
        title: '方案 C · 左右栏',
        pros: '左侧永远是动作与进度，右手专做编排/接口，大屏效率高。',
        cons: '窄屏会上下堆叠，手机要额外适配。',
        focus: '左：用；右：编 / 接口 Tab',
      },
      d: {
        title: '方案 D · 阶梯层',
        pros: '自然阅读顺序；复杂层默认折叠，不会吓到业务用户。',
        cons: '层数多时显得「说明书」感稍强。',
        focus: '① 打开与交付 ② 试运营 ③ 编排 ④ 接口',
      },
    }

    const APP_HEAD = `
      <div class="stage-head">
        <div class="app-id">
          <div class="app-icon">沪</div>
          <div>
            <h2>>> 通用办公·上海话语音</h2>
            <div class="pills">
              <span class="pill">9 项能力</span>
              <span class="pill warn">APK 构建中</span>
              <span class="pill">@公开</span>
              <span class="pill">7/14 11:43</span>
            </div>
          </div>
        </div>
        <div class="head-actions">
          <button type="button" class="btn ghost">复制链接</button>
          <a class="btn" href="http://101.32.209.251/agents/shanghai-voice" target="_blank" rel="noreferrer">打开</a>
          <button type="button" class="btn ghost">移除</button>
          <button type="button" class="btn primary">关闭</button>
        </div>
      </div>`

    const PROGRESS = `
      <div class="progress">
        <div class="progress-top">
          <strong>交付进度 · 五端发布</strong>
          <span>自动检测中… 92%</span>
        </div>
        <div class="bar"><i></i></div>
        <ul class="steps">
          <li class="done">✓ 应用已创建 · 已进「我的应用」</li>
          <li class="done">✓ 网页运行时就绪 · 可立即打开</li>
          <li class="active">◌ Flutter APK 打包中 · Gradle 进行中</li>
        </ul>
      </div>`

    const FUN_RAIL = `
      <div class="rail">
        <h4>>> 功能编排 · 用户感知能力</h4>
        <div class="node">用户意图<small>业务请求进入</small></div>
        <div class="node">通用办公<small>办公数据处理</small></div>
        <div class="node">上海话语音<small>方言语音对话</small></div>
        <div class="node">待办中心<small>审批与待办汇总</small></div>
        <div class="node">多端门户<small>网页 + App 统一入口</small></div>
      </div>`

    const DATA_RAIL = `
      <div class="rail">
        <h4>>> 数据编排 · 可验证接口</h4>
        <div class="api"><span class="tag">IN</span><div><code>POST /api/v1/runtime/…/ingress/webhook</code>
          <div class="api-actions"><button class="btn">复制 curl</button><button class="btn primary">测试</button></div></div></div>
        <div class="api"><span class="tag out">OUT</span><div><code>POST /api/v1/runtime/…/ingress/dispatch</code>
          <div class="api-actions"><button class="btn">复制 curl</button><button class="btn primary">测试</button></div></div></div>
        <div class="api"><span class="tag">IN</span><div><code>POST /api/v1/runtime/…/modules/shanghai-voice/input</code>
          <div class="api-actions"><button class="btn">复制 curl</button><button class="btn primary">测试</button></div></div></div>
      </div>`

    const TEST_BLOCK = `
      <div class="test-grid">
        <div class="test-card">
          <h4>打开应用 <span class="badge real">真链路</span></h4>
          <p>网页运行时已就绪。直接体验上海话语音助手。</p>
          <a class="btn primary" href="http://101.32.209.251/agents/shanghai-voice" target="_blank" rel="noreferrer">在新标签打开</a>
        </div>
        <div class="test-card">
          <h4>试运营 <span class="badge real">模拟走流程</span></h4>
          <p>按功能编排逐步高亮，看业务路径是否说得通。</p>
          <button type="button" class="btn primary">▶ 开始试运营</button>
        </div>
        <div class="test-card">
          <h4>语音真接口 <span class="badge real">可验</span></h4>
          <p><code>GET /api/v1/voice/config</code> · WS shanghai-agent</p>
          <button type="button" class="btn primary">测 voice/config</button>
        </div>
        <div class="test-card">
          <h4>编排 REST <span class="badge mock">mock</span></h4>
          <p>runtime ingress / modules … 演示契约，点测返回 mock JSON。</p>
          <button type="button" class="btn">测 ingress</button>
          <button type="button" class="btn">测模块 IN</button>
        </div>
      </div>`

    function bindInnerTabs(root, key) {
      const tabs = root.querySelectorAll(`[data-inner="${key}"]`)
      const panels = root.querySelectorAll(`[data-panel="${key}"]`)
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const id = tab.dataset.tab
          tabs.forEach((t) => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'))
          panels.forEach((p) => p.classList.toggle('hidden', p.dataset.id !== id))
        })
      })
    }

    function render(plan) {
      const meta = META[plan]
      document.getElementById('meta').innerHTML = `
        <div class="meta-card"><strong>${meta.title}</strong><span>${meta.focus}</span></div>
        <div class="meta-card"><strong>适合</strong><span>${meta.pros}</span></div>
        <div class="meta-card"><strong>取舍</strong><span>${meta.cons}</span></div>`

      let body = ''
      if (plan === 'a') {
        body = `
          <div class="body" data-root="a">
            <p class="panel-note">默认 Tab = 用户能立刻做的事；编排与接口分开，避免第一屏堆路径。</p>
            <div class="tabs" role="tablist">
              <button type="button" data-inner="a" data-tab="use" aria-selected="true">使用与测试</button>
              <button type="button" data-inner="a" data-tab="flow" aria-selected="false">功能编排</button>
              <button type="button" data-inner="a" data-tab="api" aria-selected="false">数据接口</button>
            </div>
            <div data-panel="a" data-id="use">
              ${PROGRESS}
              ${TEST_BLOCK}
            </div>
            <div class="hidden" data-panel="a" data-id="flow">
              <p class="panel-note">只露出用户能理解的能力节点；可拖序、展开更多。</p>
              ${FUN_RAIL}
            </div>
            <div class="hidden" data-panel="a" data-id="api">
              <p class="panel-note">标注真链路 / mock；路径用后端可验的 modules/ingress，不用 step-0。</p>
              ${DATA_RAIL}
            </div>
          </div>`
      } else if (plan === 'b') {
        body = `
          <div class="body" data-root="b">
            <div class="cta-row">
              <div class="cta main">
                <h3>马上体验</h3>
                <p>网页已就绪。APK 仍在打包，不影响先试网页。</p>
                <a class="btn primary" href="http://101.32.209.251/agents/shanghai-voice" target="_blank" rel="noreferrer">打开网页应用</a>
                <button type="button" class="btn" style="margin-left:6px">▶ 试运营</button>
              </div>
              <div class="cta">
                <h3>交付摘要</h3>
                <p>网页 ✓ · APK 打包中 92%</p>
                <button type="button" class="btn">查看步骤</button>
              </div>
              <div class="cta">
                <h3>一键冒烟</h3>
                <p>voice/config + 一条 runtime mock</p>
                <button type="button" class="btn primary">跑测试</button>
              </div>
            </div>
            <div class="tabs">
              <button type="button" data-inner="b" data-tab="flow" aria-selected="true">功能编排</button>
              <button type="button" data-inner="b" data-tab="api" aria-selected="false">数据接口与验证</button>
            </div>
            <div data-panel="b" data-id="flow">${FUN_RAIL}</div>
            <div class="hidden" data-panel="b" data-id="api">
              ${TEST_BLOCK}
              <div style="height:10px"></div>
              ${DATA_RAIL}
            </div>
          </div>`
      } else if (plan === 'c') {
        body = `
          <div class="body" data-root="c">
            <div class="split">
              <aside class="side">
                <h3>先做这些</h3>
                <a class="btn primary" href="http://101.32.209.251/agents/shanghai-voice" target="_blank" rel="noreferrer">打开应用</a>
                <button type="button" class="btn">▶ 开始试运营</button>
                <button type="button" class="btn">跑接口冒烟</button>
                <div style="height:8px"></div>
                ${PROGRESS}
                <p class="panel-note" style="margin:0">左侧固定感知区，滚动编排时仍可见。</p>
              </aside>
              <div>
                <div class="tabs">
                  <button type="button" data-inner="c" data-tab="flow" aria-selected="true">功能编排</button>
                  <button type="button" data-inner="c" data-tab="api" aria-selected="false">数据接口</button>
                </div>
                <div data-panel="c" data-id="flow">
                  <div class="dual">
                    ${FUN_RAIL}
                    <div class="bridge">›</div>
                    <div class="rail" style="opacity:.55">
                      <h4>数据轨摘要</h4>
                      <div class="node">3 组 IN/OUT<small>切到「数据接口」看完整路径与测试</small></div>
                    </div>
                  </div>
                </div>
                <div class="hidden" data-panel="c" data-id="api">
                  ${TEST_BLOCK}
                  <div style="height:10px"></div>
                  ${DATA_RAIL}
                </div>
              </div>
            </div>
          </div>`
      } else {
        body = `
          <div class="body" data-root="d">
            <div class="ladder">
              <section class="layer">
                <div class="layer-head">① 打开与交付 <span class="hint">用户第一眼</span></div>
                <div class="layer-body">
                  ${PROGRESS}
                  <a class="btn primary" href="http://101.32.209.251/agents/shanghai-voice" target="_blank" rel="noreferrer">打开网页应用</a>
                </div>
              </section>
              <section class="layer">
                <div class="layer-head">② 试一试 <span class="hint">生成应用的测试区</span></div>
                <div class="layer-body">${TEST_BLOCK}</div>
              </section>
              <details class="layer" open>
                <summary>③ 功能编排 <span class="hint">可拖序 · 默认展开</span></summary>
                <div class="layer-body">${FUN_RAIL}</div>
              </details>
              <details class="layer">
                <summary>④ 数据接口（复杂） <span class="hint">默认折叠 · mock / 真链路标注</span></summary>
                <div class="layer-body">${DATA_RAIL}</div>
              </details>
            </div>
          </div>`
      }

      const stage = document.getElementById('stage')
      stage.innerHTML = APP_HEAD + body
      bindInnerTabs(stage, plan)
    }

    let current = 'a'
    document.querySelectorAll('.pick-bar button').forEach((btn) => {
      btn.addEventListener('click', () => {
        current = btn.dataset.plan
        document.querySelectorAll('.pick-bar button').forEach((b) => {
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false')
        })
        render(current)
      })
    })

    document.getElementById('copy-choice').addEventListener('click', async () => {
      const text = `选 ${current.toUpperCase()} · ${META[current].title}`
      try {
        await navigator.clipboard.writeText(text)
        alert('已复制：' + text)
      } catch {
        prompt('复制下面这行发给我：', text)
      }
    })

    render('a')
  </script>
</body>
</html>
