<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BlockHub">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="52%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="18" y="18" width="220" height="220" rx="44" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
  <text x="128" y="158" text-anchor="middle" font-size="92" font-weight="900" fill="#fef3c7"
        font-family="Segoe UI, Inter, PingFang SC, Microsoft YaHei, sans-serif" filter="url(#glow)">&gt;&gt;</text>
</svg>
