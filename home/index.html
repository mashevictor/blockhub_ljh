<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-build-version" content="__BUILD_VERSION__" />
    <meta name="app-build-time" content="__BUILD_TIME__" />
    <meta name="description" content="积木仓 BlockHub — 五分钟搭好，打开就能用" />
    <meta name="theme-color" content="#db2777" />
    <meta property="og:title" content="积木仓 BlockHub" />
    <meta property="og:description" content="五分钟搭好，打开就能用" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <title>积木仓 BlockHub · 五分钟搭好，打开就能用</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=__BUILD_VERSION__" />
    <link rel="icon" href="/favicon.ico?v=__BUILD_VERSION__" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=__BUILD_VERSION__" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=__BUILD_VERSION__" />
    <link rel="manifest" href="/manifest.webmanifest?v=__BUILD_VERSION__" />
  </head>
  <body data-build-version="__BUILD_VERSION__">
    <div id="root"></div>
    <script>
      /* 手机端 HTML 被缓存时：对比 /version.json，不一致则带 _bhv 强制刷新（每会话最多一次，防死循环） */
      (function () {
        var meta = document.querySelector('meta[name="app-build-version"]')
        var local = meta && meta.getAttribute('content')
        if (!local || local.indexOf('__') === 0) return
        var key = 'blockhub_html_bust_once'
        try {
          if (sessionStorage.getItem(key)) return
        } catch (e) {}
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (remote) {
            if (!remote || !remote.version || remote.version === local) return
            try { sessionStorage.setItem(key, remote.version) } catch (e) {}
            var u = new URL(location.href)
            u.searchParams.set('_bhv', remote.version)
            location.replace(u.toString())
          })
          .catch(function () {})
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- BlockHub home build __BUILD_VERSION__ @ __BUILD_TIME__ -->
  </body>
</html>
