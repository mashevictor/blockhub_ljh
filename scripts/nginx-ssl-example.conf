# BlockHub Nginx + HTTPS 示例（P1 生产正式化）
# 替换 YOUR_DOMAIN / BLOCKHUB_ROOT / cert 路径后启用。
#
# Let's Encrypt:
#   certbot certonly --nginx -d YOUR_DOMAIN
#   certbot certonly --nginx -d admin.YOUR_DOMAIN
#
# 启用:
#   cp scripts/nginx-ssl-example.conf /etc/nginx/sites-available/blockhub
#   ln -sf /etc/nginx/sites-available/blockhub /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# HTTP → HTTPS（308 保留 POST；301 会导致浏览器把发布 POST 改成 GET → Method Not Allowed）
server {
    listen 80;
    server_name YOUR_DOMAIN admin.YOUR_DOMAIN;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# Home + Runtime + API（同域）
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root BLOCKHUB_ROOT/home/dist;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;  # SSE
    }

    location /r/ {
        alias BLOCKHUB_ROOT/runtime-web/dist/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Admin 子域（可选）
server {
    listen 443 ssl http2;
    server_name admin.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    root BLOCKHUB_ROOT/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
