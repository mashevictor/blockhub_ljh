# BlockHub Nginx — 复制到 /etc/nginx/sites-available/blockhub
# 静态目录结构：
#   /var/www/blockhub/home/index.html      ← home/dist 内容
#   /var/www/blockhub/admin/index.html     ← frontend/dist 内容
#   /var/www/blockhub/admin/assets/*.js    ← Admin JS（路径须含 /admin/assets/）

server {
    listen 80;
    server_name 101.32.209.251;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Admin（base=/admin/，用 root 不要用 alias）
    location /admin/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /admin/index.html;
    }

    # Home
    location / {
        root /var/www/blockhub/home;
        try_files $uri $uri/ /index.html;
    }
}
