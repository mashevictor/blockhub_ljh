# BlockHub Nginx — 部署时由 deploy.sh 写入 /etc/nginx/sites-available/blockhub
# 域名：blockhub.club（DNS A → 124.222.177.43）；IP 访问仍保留兼容
#
# 重要：HTTP→HTTPS 必须用 308（保留 POST），不要用 301。
# 浏览器遇到 301 常会把 POST /api/.../publish 改成 GET，后端返回 Method Not Allowed。
# 80 端口对 /api/ 直接反代，避免发布接口再走一次跳转。

# ---------- HTTP：ACME + API 直代 + 其余 308 升 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name blockhub.club www.blockhub.club 124.222.177.43;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # 发布/登录等 API 不走跳转，避免 POST→GET
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/v1/voice/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blockhub.club www.blockhub.club 124.222.177.43;

    # SSL — deploy.sh 会按是否存在 Let's Encrypt 证书替换下列两行
    ssl_certificate     SSL_CERTIFICATE_PATH;
    ssl_certificate_key SSL_CERTIFICATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    client_max_body_size 32m;

    # 优先读构建产物；若 uploads 不可读则回落到 /var/www/blockhub/downloads（ship 会同步拷贝）
    location = /downloads/shanghai-voice.apk {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shanghai-voice.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 403 404 = @shanghai_apk_fallback;
    }

    # named location 不能用 alias，改用 root + rewrite
    location @shanghai_apk_fallback {
        root /var/www/blockhub/downloads;
        rewrite ^ /shanghai-voice.apk break;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shanghai-voice.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /downloads/shanghai-voice.version.json {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.version.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /downloads/shanghai-voice.version.txt {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.version.txt;
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /api/v1/voice/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 员工端 Web 运行时 SPA：/r/{appId}
    # 带哈希的静态资源必须优先于 SPA fallback，且关掉 access_log 减 IO
    location ^~ /r/assets/ {
        root /var/www/blockhub;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;
        try_files $uri =404;
    }

    location = /r/version.json {
        root /var/www/blockhub;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    location = /r/version.txt {
        root /var/www/blockhub;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type text/plain;
    }

    location ~ ^/r/([a-z0-9]+)/download$ {
        proxy_pass http://127.0.0.1:8001/api/v1/runtime/$1/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /r/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /r/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /admin {
        return 308 /admin/;
    }

    # Home 旧 /login /register → 统一后台登录（兼容未更新前端包）
    location = /login {
        return 302 $scheme://$host/admin/login;
    }

    location = /register {
        return 302 $scheme://$host/admin/login;
    }

    location = /admin/index.html {
        root /var/www/blockhub;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /admin/login {
        root /var/www/blockhub;
        try_files /admin/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /version.txt {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type text/plain;
    }

    location = /version.json {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    location /assets/ {
        root /var/www/blockhub/home;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;
    }

    location /admin/assets/ {
        root /var/www/blockhub;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;
    }

    location /admin/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /admin/index.html;
    }

    # 资料包 HTML/PDF（home/public/downloads → 构建后 /var/www/blockhub/home/downloads/）
    # shanghai-voice APK/版本 仍走上方精确 location
    location ^~ /downloads/ {
        root /var/www/blockhub/home;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        types {
            application/pdf                             pdf;
            text/html                                   html htm;
            application/json                            json;
            application/vnd.android.package-archive     apk;
        }
        default_type application/octet-stream;
    }

    # /industry 汇总页已下线 → 首页行业方案区（避免 public/industry/ 静态目录冲突）
    location = /industry {
        return 302 /#product;
    }

    # 关键：行业配图 / 新闻封面 不得走下方 SPA 的 no-cache。
    # Network 里 thumb.jpg 5–10s、大量 pending，主因是每次整页强制重下 20+ 张图。
    location ~* ^/(industry|news)/.+\.(jpe?g|png|webp|gif|svg|ico)$ {
        root /var/www/blockhub/home;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        expires 30d;
    }

    # 行业独立站 HTML/CSS：短缓存，改文案后一天内刷新
    location ^~ /industry-sites/ {
        root /var/www/blockhub/home;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location ^~ /industry-microsites/ {
        root /var/www/blockhub/home;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # 站点图标等根目录静态图
    location ~* ^/(favicon|apple-touch-icon|og-image).*\.(png|ico|jpe?g|webp)$ {
        root /var/www/blockhub/home;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # SPA 入口：手机微信/Safari 常缓存「/」目录索引 HTML，须与 index.html 同样禁缓存
    location / {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
