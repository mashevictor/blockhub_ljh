# BlockHub Nginx — 部署时由 deploy.sh 写入 /etc/nginx/sites-available/blockhub
# 域名：blockhub.club（DNS A → 101.32.209.251）；IP 访问仍保留兼容

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blockhub.club www.blockhub.club 101.32.209.251;

    # SSL — 默认自签；上线后建议 certbot 换正式证书：
    #   sudo certbot --nginx -d blockhub.club -d www.blockhub.club
    ssl_certificate     /etc/nginx/ssl/blockhub-selfsigned.crt;
    ssl_certificate_key  /etc/nginx/ssl/blockhub-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    # 优先读构建产物；若 uploads 不可读则回落到 /var/www/blockhub/downloads（ship 会同步拷贝）
    location = /downloads/shanghai-voice.apk {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shanghai-voice.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 403 404 = @shanghai_apk_fallback;
    }

    # named location 不能用 alias，改用 root + rewrite
    location @shanghai_apk_fallback {
        root /var/www/blockhub/downloads;
        rewrite ^ /shanghai-voice.apk break;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shanghai-voice.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /downloads/shanghai-voice.version.json {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.version.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /downloads/shanghai-voice.version.txt {
        alias BLOCKHUB_ROOT/backend/uploads/apks/shanghai-voice.version.txt;
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /api/v1/voice/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 员工端 Web 运行时 SPA：/r/{appId}
    location ~ ^/r/([a-z0-9]+)/download$ {
        proxy_pass http://127.0.0.1:8001/api/v1/runtime/$1/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /r/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /r/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /r/assets/ {
        root /var/www/blockhub;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Home 旧 /login /register → 统一后台登录（兼容未更新前端包）
    location = /login {
        return 302 $scheme://$host/admin/login;
    }

    location = /register {
        return 302 $scheme://$host/admin/login;
    }

    location = /admin/index.html {
        root /var/www/blockhub;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /admin/login {
        root /var/www/blockhub;
        try_files /admin/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /version.txt {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type text/plain;
    }

    location = /version.json {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    location /admin/assets/ {
        root /var/www/blockhub;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        root /var/www/blockhub/home;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /admin/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /admin/index.html;
    }

    # 资料包 HTML（home/public/downloads → 构建后 /var/www/blockhub/home/downloads/）
    # shanghai-voice APK/版本 仍走上方精确 location
    location ^~ /downloads/ {
        root /var/www/blockhub/home;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/html;
    }

    # /industry 汇总页已下线 → 首页行业方案区（避免 public/industry/ 静态目录冲突）
    location = /industry {
        return 302 /#product;
    }

    # SPA 入口：手机微信/Safari 常缓存「/」目录索引 HTML，须与 index.html 同样禁缓存
    location / {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
