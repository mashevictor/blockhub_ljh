# BlockHub Nginx — 复制到 /etc/nginx/sites-available/blockhub

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.32.209.251 _;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 员工端 Web 运行时 SPA：/r/{appId}
    location ~ ^/r/([a-z0-9]+)/download$ {
        proxy_pass http://127.0.0.1:8001/api/v1/runtime/$1/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /r/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /r/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /r/assets/ {
        root /var/www/blockhub;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /admin/index.html {
        root /var/www/blockhub;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        root /var/www/blockhub/home;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /admin/assets/ {
        root /var/www/blockhub;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        root /var/www/blockhub/home;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /admin/ {
        root /var/www/blockhub;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /var/www/blockhub/home;
        try_files $uri $uri/ /index.html;
    }
}
