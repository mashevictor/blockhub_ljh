# BlockHub 备案关站模式 — 仅静态页，不反代官网/API
# 域名：blockhub.club / www.blockhub.club
#
# 启用：
#   sudo bash scripts/enable-beian.sh
# 恢复正式站：
#   sudo bash scripts/disable-beian.sh
#
# SSL 证书路径与正式站一致（Let's Encrypt）。若尚无证书，可先只开 80。

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;
    server_name blockhub.club www.blockhub.club;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    root /beian;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS（有证书时生效；证书路径由 enable 脚本替换） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blockhub.club www.blockhub.club;

    ssl_certificate     /etc/letsencrypt/live/blockhub.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockhub.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /beian;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
