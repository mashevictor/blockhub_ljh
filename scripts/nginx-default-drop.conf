# 默认虚拟主机兜底 —— 丢弃无法匹配到具体 server_name 的请求
# 启用：ln -sf /etc/nginx/sites-available/default-drop /etc/nginx/sites-enabled/default-drop
# 注意：/etc/nginx/sites-available/blockhub 的 listen 行不能带 default_server，
# 否则会与本文件的 default_server 冲突（duplicate default server）。
# 作用：直连 IP 以外的未知 Host 一律 444 断开，
# 不再落到 blockhub 的 SPA catch-all 伪装成 200。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/blockhub-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/blockhub-selfsigned.key;

    return 444;
}
