name: trackchat_runtime_app
description: TrackChat Flutter runtime — configurable app name, icon, tenant config.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  blockhub_flutter_core:
    path: ../packages/blockhub_flutter_core
  capability_chat_qa:
    path: ../packages/capability_chat_qa
  capability_shanghai_voice:
    path: ../packages/capability_shanghai_voice
  capability_approval_flow:
    path: ../packages/capability_approval_flow
  capability_device_repair:
    path: ../packages/capability_device_repair
  capability_quality_inspect:
    path: ../packages/capability_quality_inspect
  capability_inventory_count:
    path: ../packages/capability_inventory_count
  capability_member_loyalty:
    path: ../packages/capability_member_loyalty
  capability_med_triage:
    path: ../packages/capability_med_triage
  capability_nurse_shift:
    path: ../packages/capability_nurse_shift
  capability_game_support:
    path: ../packages/capability_game_support
  capability_school_notice:
    path: ../packages/capability_school_notice
  capability_property_repair:
    path: ../packages/capability_property_repair
  capability_site_patrol:
    path: ../packages/capability_site_patrol
  capability_class_schedule:
    path: ../packages/capability_class_schedule
  capability_hotel_booking:
    path: ../packages/capability_hotel_booking
  capability_homework_qa:
    path: ../packages/capability_homework_qa
  capability_audit_log:
    path: ../packages/capability_audit_log
  capability_kb:
    path: ../packages/capability_kb
  capability_dashboard:
    path: ../packages/capability_dashboard
  capability_data_nl_query:
    path: ../packages/capability_data_nl_query
  capability_integration:
    path: ../packages/capability_integration
  capability_multi_agent:
    path: ../packages/capability_multi_agent
  capability_security_mask:
    path: ../packages/capability_security_mask
  capability_flutter_tools:
    path: ../packages/capability_flutter_tools
  dio: ^5.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.70.2
  package_info_plus: ^8.1.2
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "branding/icon.png"
  adaptive_icon_background: "#4338ca"
  adaptive_icon_foreground: "branding/icon.png"
