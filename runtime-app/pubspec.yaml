name: trackchat_runtime_app
description: TrackChat Flutter runtime — configurable app name, icon, tenant config.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.70.2
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "branding/icon.png"
  adaptive_icon_background: "#4338ca"
  adaptive_icon_foreground: "branding/icon.png"
