services:
  postgres:
    image: postgres:16-alpine
    container_name: trackchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackchat
      POSTGRES_PASSWORD: trackchat
      POSTGRES_DB: trackchat
    ports:
      - "5432:5432"
    volumes:
      - trackchat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackchat -d trackchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trackchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trackchat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  trackchat_pg_data:
  trackchat_redis_data:
