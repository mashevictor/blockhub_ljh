<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>积木仓 · 应用已发布</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F5F9;font-family:Arial,Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;color:transparent;">
    您的应用「{应用名称}」已发布，可打开网页版继续使用。本邮件不含安装包附件。
  </div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#F1F5F9;">
    <tr>
      <td align="center" style="padding:28px 12px;">

        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;">

          <!-- Brand bar -->
          <tr>
            <td bgcolor="#0F172A" style="background-color:#0F172A;padding:20px 28px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="font-size:18px;font-weight:700;color:#FFFFFF;letter-spacing:0.02em;">
                    积木仓 BlockHub
                  </td>
                  <td align="right" style="font-size:12px;color:#94A3B8;">
                    应用交付通知
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Status -->
          <tr>
            <td style="padding:24px 28px 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding:10px 14px;background-color:#F8FAFC;border-radius:8px;border-left:4px solid #0F172A;">
                    <p style="margin:0;font-size:14px;font-weight:600;color:#0F172A;line-height:1.4;">
                      发布成功 · {交付形式}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:22px 28px 8px;">
              <p style="margin:0 0 12px;font-size:16px;font-weight:600;color:#0F172A;line-height:1.5;">
                {用户姓名}，您好：
              </p>
              <p style="margin:0 0 20px;font-size:14px;color:#475569;line-height:1.7;">
                您在积木仓创建的应用已发布完成。请通过下方链接打开网页版；如需安装 Android 客户端，请使用邮件中的下载链接（本邮件不附带安装包文件，以避免邮箱拦截）。
              </p>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:20px;">
                <tr>
                  <td style="padding:14px 16px;background-color:#F8FAFC;border-radius:8px;border:1px solid #E2E8F0;">
                    <p style="margin:0 0 4px;font-size:11px;font-weight:600;color:#64748B;letter-spacing:0.04em;">应用名称</p>
                    <p style="margin:0;font-size:18px;font-weight:700;color:#0F172A;line-height:1.4;">{应用名称}</p>
                  </td>
                </tr>
              </table>

              {下载链接区块}

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:8px 0 20px;">
                <tr>
                  <td style="padding:14px 16px;background-color:#F8FAFC;border-radius:8px;border:1px solid #E2E8F0;">
                    <p style="margin:0 0 6px;font-size:12px;font-weight:600;color:#0F172A;">已包含能力</p>
                    <p style="margin:0;font-size:13px;color:#475569;line-height:1.65;">{场景列表}</p>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 8px;font-size:13px;color:#64748B;line-height:1.65;">
                请妥善保管访问链接。如有问题，可直接回复本邮件。
              </p>
              <p style="margin:16px 0 0;font-size:13px;color:#64748B;line-height:1.6;">
                祝好，<br />
                <span style="font-weight:700;color:#0F172A;">积木仓团队</span>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:18px 28px 22px;border-top:1px solid #E2E8F0;background-color:#F8FAFC;">
              <p style="margin:0 0 4px;font-size:11px;color:#94A3B8;line-height:1.5;">
                此邮件由积木仓系统自动发送。若不希望再收到同类通知，请回复说明。
              </p>
              <p style="margin:0;font-size:11px;color:#94A3B8;line-height:1.5;">
                blockhub.club · 打开就能用
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
