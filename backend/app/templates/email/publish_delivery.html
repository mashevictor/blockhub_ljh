<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积木仓 BlockHub - 您的应用已就绪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4f8 0%, #e8eef4 100%);
            color: #333;
            line-height: 1.7;
            font-size: 15px;
            padding: 24px 12px;
        }
        .wrap {
            max-width: 560px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .header {
            background: linear-gradient(135deg, #4338ca 0%, #312e81 100%);
            padding: 28px 24px;
            text-align: center;
        }
        .logo { height: 48px; max-width: 180px; object-fit: contain; }
        .body-inner { padding: 28px 32px; }
        .hi { margin-bottom: 18px; font-size: 17px; color: #1a1a1a; font-weight: 500; }
        .p { margin-bottom: 14px; color: #444; }
        .app-desc {
            margin: 20px 0;
            padding: 16px 18px;
            background: #f8fafb;
            border-radius: 8px;
            color: #555;
            font-size: 14px;
            border-left: 4px solid #4338ca;
        }
        .download-block {
            margin: 20px 0;
            padding: 16px 18px;
            background: #f0f9ff;
            border-radius: 8px;
            border: 1px solid #c7d2fe;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .tip { margin-top: 20px; font-size: 14px; color: #666; }
        .bye {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #888;
        }
        .footer-brand { color: #4338ca; font-weight: 600; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <img src="{LOGO_URL}" alt="积木仓 BlockHub" class="logo" width="160" height="48">
        </div>
        <div class="body-inner">
            <p class="hi">您好，{用户姓名}：</p>
            <p class="p">您在积木仓 BlockHub 创建的智能应用已发布成功，交付形式：<span class="badge">{交付形式}</span></p>
            <p class="p">应用名称：<strong>{应用名称}</strong></p>

            {下载链接区块}

            <div class="app-desc">
                <strong>已包含能力</strong>：{场景列表}
            </div>

            <p class="tip">请妥善保管访问链接。如有疑问，可直接回复本邮件，我们会尽快处理。</p>
            <p class="bye">祝好，<br><span class="footer-brand">积木仓 BlockHub 团队</span></p>
        </div>
    </div>
</body>
</html>
