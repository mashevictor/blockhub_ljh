<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlockHub / CapShip · 文档索引 v3.0</title>
  <style>
    :root { --bg:#0b1220; --fg:#e2e8f0; --muted:#94a3b8; --accent:#2dd4bf; --line:rgba(148,163,184,.22); --card:#121a2b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width:820px; margin:0 auto; padding:40px 20px 80px; }
    h1 { font-size:28px; margin:0 0 8px; }
    h1 em { font-style:normal; color:var(--accent); }
    p { color:var(--muted); line-height:1.6; }
    a.card {
      display:block; text-decoration:none; color:inherit; background:var(--card);
      border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:10px 0;
      transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); transform: translateY(-1px); }
    a.card strong { display:block; color:var(--accent); margin-bottom:4px; }
    a.card span { font-size:13px; color:var(--muted); }
  </style>
</head>
