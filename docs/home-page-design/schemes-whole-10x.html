<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>积木仓 · 整页设计 10 方案（简版 + 配图）</title>
  <style>
    :root {
      --gold: #b8860b; --gold-l: #d4af37; --gold-d: #96700a;
      --bg: #faf9f7; --surf: #fff; --text: #1c1917; --muted: #78716c; --border: #e8dfc0;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #eee; color: var(--text); font-size: 14px; }

    .top {
      position: sticky; top: 0; z-index: 99;
      background: #fff; border-bottom: 1px solid #ddd;
      padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    }
    .top h1 { font-size: 15px; flex: 1; min-width: 200px; }
    .top p { font-size: 11px; color: var(--muted); width: 100%; margin-top: -6px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; }
    .tabs button {
      border: 1px solid #ddd; background: #f8f8f8; padding: 6px 11px;
      border-radius: 999px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .tabs button.on { background: var(--gold-d); color: #fff; border-color: var(--gold-d); }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
    .intro {
      background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px;
      font-size: 12px; color: var(--muted); line-height: 1.6; border: 1px solid #e5e5e5;
    }
    .intro strong { color: var(--gold-d); }
    .panel { display: none; }
    .panel.on { display: block; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* —— 通用页面壳 —— */
    .page {
      background: var(--surf); border-radius: 16px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.08); border: 1px solid #e0e0e0;
      min-height: 560px; display: flex; flex-direction: column;
    }
    .pg-header {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: rgba(255,255,255,.95);
    }
    .pg-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg,var(--gold-d),var(--gold-l)); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .pg-brand { font-size: 13px; font-weight: 800; }
    .pg-brand span { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
    .pg-modes { display: flex; gap: 4px; margin-left: auto; }
    .pg-modes i { font-style: normal; font-size: 10px; padding: 5px 10px; border-radius: 999px; background: #f5f5f4; color: var(--muted); font-weight: 600; }
    .pg-modes i.on { background: var(--gold-d); color: #fff; }
    .pg-actions { display: flex; gap: 6px; font-size: 10px; color: var(--muted); margin-left: 8px; }
    .pg-main { flex: 1; }
    .pg-footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); text-align: center; }

    .btn-g {
      border: none; background: linear-gradient(145deg,var(--gold-d),var(--gold-l));
      color: #fff; font-weight: 700; padding: 12px 28px; border-radius: 12px;
      font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .inp {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
      font-size: 14px; font-family: inherit; width: 100%; outline: none;
    }
    .inp:focus { border-color: var(--gold-l); }

    /* 01 大图 Hero */
    .s01-hero {
      height: 220px; background: url('assets/hero-gold-soft.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 20px;
      position: relative;
    }
    .s01-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg,rgba(10,22,40,.45),rgba(10,22,40,.65)); }
    .s01-hero * { position: relative; z-index: 1; }
    .s01-hero h2 { font-size: 22px; margin-bottom: 6px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .s01-hero p { font-size: 12px; opacity: .9; }
    .s01-body { padding: 24px 20px; text-align: center; }
    .s01-body .inp { max-width: 480px; margin: 0 auto 12px; display: block; text-align: center; border: none; border-bottom: 2px solid var(--border); border-radius: 0; background: transparent; font-size: 18px; }
    .s01-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .s01-chips span { font-size: 11px; padding: 4px 12px; border-radius: 999px; background: #f5f5f4; color: var(--muted); }

    /* 02 三卡片 */
    .s02 { padding: 24px 20px; }
    .s02 h2 { font-size: 18px; text-align: center; margin-bottom: 4px; }
    .s02 > p { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .s02-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media(max-width:640px){ .s02-cards { grid-template-columns: 1fr; } }
    .s02-card {
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: transform .2s, box-shadow .2s; background: #fff;
    }
    .s02-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(184,134,11,.15); }
    .s02-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .s02-card div { padding: 12px; }
    .s02-card strong { font-size: 13px; display: block; }
    .s02-card em { font-size: 11px; color: var(--muted); font-style: normal; }

    /* 03 分屏 */
    .s03 { display: grid; grid-template-columns: 1fr 1fr; min-height: 480px; }
    @media(max-width:640px){ .s03 { grid-template-columns: 1fr; } }
    .s03-img { background: url('assets/hero-gold-soft.jpg') center/cover; min-height: 200px; }
    .s03-form { padding: 32px 24px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .s03-form h2 { font-size: 20px; }
    .s03-form p { font-size: 12px; color: var(--muted); }

    /* 04 极简白 */
    .s04 {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; text-align: center;
    }
    .s04 img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(184,134,11,.2); }
    .s04 h2 { font-size: 24px; font-weight: 300; margin-bottom: 24px; letter-spacing: -.02em; }
    .s04 .inp { max-width: 400px; border: none; border-bottom: 2px solid var(--border); border-radius: 0; text-align: center; font-size: 16px; background: transparent; margin-bottom: 20px; }
    .s04-modes { display: flex; gap: 16px; margin-top: 24px; font-size: 11px; color: var(--muted); }
    .s04-modes b { color: var(--gold-d); }

    /* 05 深色 */
    .s05 {
      flex: 1; background: url('assets/hero-dark-tech.jpg') center/cover;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 24px; text-align: center; color: #fff; position: relative;
    }
    .s05::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
    .s05 * { position: relative; z-index: 1; }
    .s05 h2 { font-size: 26px; margin-bottom: 8px; }
    .s05 p { font-size: 13px; opacity: .8; margin-bottom: 24px; }
    .s05 .inp { max-width: 420px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; margin-bottom: 12px; }
    .s05 .inp::placeholder { color: rgba(255,255,255,.5); }

    /* 06 杂志 */
    .s06-head { padding: 28px 24px 16px; }
    .s06-head h2 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; max-width: 480px; }
    .s06-head p { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .s06-band { height: 180px; background: url('assets/hero-gold-soft.jpg') center/cover; }
    .s06-row { display: flex; gap: 12px; padding: 16px 24px 24px; overflow-x: auto; }
    .s06-item { flex-shrink: 0; width: 100px; text-align: center; }
    .s06-item img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 6px; }
    .s06-item span { font-size: 11px; font-weight: 600; }

    /* 07 启动屏 */
    .s07 {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 24px; background: linear-gradient(180deg,#fffdf8,#faf9f7);
    }
    .s07 img { width: 160px; height: 160px; object-fit: cover; border-radius: 24px; margin-bottom: 20px; box-shadow: 0 16px 48px rgba(184,134,11,.18); }
    .s07 h2 { font-size: 18px; margin-bottom: 6px; }
    .s07 p { font-size: 12px; color: var(--muted); margin-bottom: 20px; text-align: center; max-width: 280px; }

    /* 08 步骤 */
    .s08 { padding: 24px; }
    .s08-steps { display: flex; gap: 8px; margin-bottom: 24px; font-size: 11px; font-weight: 600; color: var(--muted); }
    .s08-steps span.on { color: var(--gold-d); border-bottom: 2px solid var(--gold); padding-bottom: 4px; }
    .s08-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
    .s08-opt { border: 2px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; }
    .s08-opt.on { border-color: var(--gold); background: #fef9e7; }
    .s08-opt img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; margin-bottom: 6px; }
    .s08-opt em { font-size: 11px; font-style: normal; font-weight: 700; display: block; }

    /* 09 橱窗 */
    .s09 { padding: 20px; }
    .s09-search { margin-bottom: 16px; }
    .s09-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    @media(max-width:640px){ .s09-grid { grid-template-columns: 1fr 1fr; } }
    .s09-tile { border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 4/3; cursor: pointer; }
    .s09-tile img { width: 100%; height: 100%; object-fit: cover; }
    .s09-tile span { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: linear-gradient(transparent,rgba(0,0,0,.7)); color: #fff; font-size: 11px; font-weight: 700; }

    /* 10 底栏 */
    .s10 {
      flex: 1; display: flex; flex-direction: column; background: url('assets/hero-gold-soft.jpg') center/cover;
      position: relative;
    }
    .s10::before { content: ''; position: absolute; inset: 0; background: rgba(255,253,248,.88); }
    .s10-scroll { flex: 1; position: relative; z-index: 1; display: flex; gap: 12px; padding: 24px 20px; overflow-x: auto; align-items: center; }
    .s10-card { flex-shrink: 0; width: 140px; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.1); background: #fff; }
    .s10-card img { width: 100%; height: 100px; object-fit: cover; display: block; }
    .s10-card p { padding: 8px 10px; font-size: 11px; font-weight: 700; }
    .s10-bar {
      position: relative; z-index: 2; padding: 12px 16px 16px;
      background: #fff; border-top: 1px solid var(--border);
      display: flex; gap: 8px; box-shadow: 0 -8px 24px rgba(0,0,0,.06);
    }
    .s10-bar .inp { flex: 1; }
    .s10-bar .btn-g { padding: 12px 20px; }
  </style>
</head>
<body>

<div class="top">
  <div>
    <h1>积木仓 · 整页设计 10 方案</h1>
    <p>基于现有架构：Hero 魔方 · 三视图（描述需求 / 按行业 / 自由搭配）· 广场 · 我的应用 · 配图已压缩</p>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap">
  <div class="intro" id="intro"></div>
  <div id="panels"></div>
</div>

<script>
const SCHEMES = [
  {
    id: '01', name: '大图 Hero',
    desc: '用一张全宽配图替代复杂魔方区，下方只留一行输入 + 快捷词。信息最少，视觉最强。',
    html: `
      <div class="page">
        <header class="pg-header">
          <div class="pg-logo">积</div>
          <div class="pg-brand">积木仓<span>搭积木，造应用</span></div>

          <button class="btn-g">生成应用</button>

  {
    id: '02', name: '三卡片入口',

    html: `
      <div class="page">
        <header class="pg-header">
          <div class="pg-logo">积</div>

            <div class="s02-card"><img src="assets/thumb-module.jpg" alt="" /><div><strong>自由搭配</strong><em>36 能力积木</em></div></div>

  },
  {
    id: '03', name: '左图右表单',
    desc: '桌面端经典分屏：左侧固定配图，右侧只有标题 + 输入 + 按钮，无目录列表。',
    html: `
      <div class="page">
        <header class="pg-header">
          <div class="pg-logo">积</div>
          <div class="pg-brand">积木仓</div>
          <div class="pg-modes"><i class="on">描述需求</i><i>按行业</i><i>自由搭配</i></div>
        </header>
        <div class="s03">
          <div class="s03-img"></div>

  },
  {
    id: '04', name: '极简白',
    desc: '几乎零装饰：小圆图 + 一句标题 + 底线输入。三模式用底部小字链接切换。',
    html: `
      <div class="page">
        <header class="pg-header" style="border:none;background:transparent">
          <div class="pg-logo">积</div>

        </header>

          <img src="assets/thumb-prompt.jpg" alt="" />

          <input class="inp" placeholder="描述你的应用…" />

        </div>
      </div>`
  },
  {
    id: '05', name: '深色全屏',
    desc: '深色配图铺满，白色大字 + 半透明输入框。适合「科技 / 黑金」主题。',
    html: `
      <div class="page">
        <header class="pg-header" style="background:rgba(0,0,0,.5);border:none;color:#fff">

      </div>`

  {
    id: '06', name: '杂志封面',
    desc: '大标题 + 横图色带 + 底部三个小图入口。像产品 landing，不像后台。',
    html: `
      <div class="page">
        <header class="pg-header"><div class="pg-logo">积</div><div class="pg-brand">积木仓</div></header>

  },
  {
    id: '07', name: 'App 启动屏',
    desc: '居中一张方图 + 两句说明 + 主按钮。移动端友好，首屏极短。',
    html: `
      <div class="page">
        <div class="s07">

  {
    id: '08', name: '两步向导',
    desc: '第一步选创建方式（三图），第二步才出现输入框。每次只做一个决策。',
    html: `
      <div class="page">
        <header class="pg-header"><div class="pg-logo">积</div><div class="pg-brand">新建应用</div></header>
        <div class="s08">
          <div class="s08-steps"><span class="on">① 选方式</span><span>→</span><span>② 描述</span><span>→</span><span>③ 生成</span></div>
          <div class="s08-grid">
            <div class="s08-opt on"><img src="assets/thumb-prompt.jpg" alt="" /><em>描述需求</em></div>

        </div>
      </div>`
  },
  {
    id: '09', name: '方案橱窗',
    desc: '顶部搜索 + 六宫格场景配图。浏览像逛橱窗，而非读文档。',
    html: `
      <div class="page">
        <header class="pg-header"><div class="pg-logo">积</div><div class="pg-brand">场景橱窗</div>
          <div class="pg-modes"><i class="on">描述</i><i>行业</i><i>搭配</i></div></header>
        <div class="s09">
          <input class="inp s09-search" placeholder="搜索场景…" />

          </div>
        </div>
      </div>`
  },
  {
    id: '10', name: '底栏输入',
    desc: '上方横滑场景卡片（配图），输入栏固定在底部。拇指区操作，内容区只展示图片。',
    html: `
      <div class="page">
        <header class="pg-header"><div class="pg-logo">积</div><div class="pg-brand">积木仓</div></header>
        <div class="s10">
          <div class="s10-scroll">
            <div class="s10-card"><img src="assets/thumb-prompt.jpg" alt="" /><p>描述需求</p></div>
            <div class="s10-card"><img src="assets/thumb-industry.jpg" alt="" /><p>制造方案</p></div>
            <div class="s10-card"><img src="assets/thumb-module.jpg" alt="" /><p>自由搭配</p></div>
            <div class="s10-card"><img src="assets/thumb-prompt.jpg" alt="" /><p>销售日报</p></div>
          </div>
          <div class="s10-bar">
            <input class="inp" placeholder="一句话描述应用…" />
            <button class="btn-g">生成</button>
          </div>
        </div>
      </div>`
  },
];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');
const intro = document.getElementById('intro');

SCHEMES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.textContent = s.id + ' ' + s.name;
  btn.dataset.id = s.id;
  if (i === 0) btn.classList.add('on');
  btn.onclick = () => show(s.id);
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' on' : '');
  panel.id = 'p-' + s.id;
  panel.innerHTML = s.html;
  panels.appendChild(panel);
});

function show(id) {
  const s = SCHEMES.find(x => x.id === id);
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  panels.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + id));
  intro.innerHTML = '<strong>方案 ' + s.id + ' · ' + s.name + '</strong> — ' + s.desc +
    '<br>架构保留：Header（品牌+三视图+广场）· Main（当前视图）· Footer · 配图见 <code>assets/*.jpg</code>（已压缩 ~24–84KB）';
}

show('01');
</script>
