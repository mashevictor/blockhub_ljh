<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 · 侧栏树 + 行业大字封面</title>
  <style>
    :root {
      --ink: #14201c;
      --paper: #f3f0e8;
      --panel: #fffdf8;
      --line: #d9d2c4;
      --muted: #6b736c;
      --accent: #0f766e;
      --accent-soft: #d9f3ef;
      --side: #1a2a26;
      --side-fg: #e7f2ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", serif; background: var(--paper); color: var(--ink); }
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    aside {
      background: var(--side); color: var(--side-fg);
      padding: 18px 14px; display: flex; flex-direction: column; gap: 14px;
    }
    .brand { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
    .aside-title { font-size: 15px; font-weight: 700; margin: 0; font-family: "Segoe UI", sans-serif; }
    .hint { font-size: 12px; opacity: .7; line-height: 1.45; font-family: "Segoe UI", sans-serif; }
    .nav { overflow: auto; flex: 1; }
    details { border-top: 1px solid rgba(255,255,255,.08); padding: 8px 0; }
    summary {
      list-style: none; cursor: pointer; font-family: "Segoe UI", sans-serif;
      font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .75;
      display: flex; justify-content: space-between; padding: 4px 6px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; opacity: .5; }
    details[open] summary::after { content: "−"; }
    .child {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: inherit; padding: 8px 10px; margin: 2px 0; border-radius: 8px; cursor: pointer;
      font: 13px/1.3 "Segoe UI", sans-serif;
    }
    .child:hover, .child.on { background: rgba(45,212,191,.18); color: #9ff3e4; }
    main { padding: 28px 36px 48px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 22px; font-family: "Segoe UI", sans-serif; font-size: 12px; color: var(--muted);
    }
    .back { color: var(--accent); text-decoration: none; }
    .hero {
      background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
      padding: 48px 40px 40px; margin-bottom: 18px;
      background-image:
        linear-gradient(120deg, rgba(15,118,110,.08), transparent 40%),
        radial-gradient(600px 240px at 90% 10%, rgba(15,118,110,.12), transparent 60%);
    }
    .eyebrow { font-family: "Segoe UI", sans-serif; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
    .hero h1 { margin: 0; font-size: clamp(42px, 7vw, 72px); line-height: .95; letter-spacing: -.03em; max-width: 10ch; }
    .hero p { margin: 18px 0 0; max-width: 42ch; font-size: 16px; line-height: 1.55; color: var(--muted); font-family: "Segoe UI", sans-serif; }
    .cta-row { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; font-family: "Segoe UI", sans-serif; }
    .btn {
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      padding: 10px 16px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--accent); }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
      font-family: "Segoe UI", sans-serif;
    }
    .panel h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
    .panel .sub { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 6px 10px; font-size: 11px; cursor: pointer; color: var(--muted);
    }
    .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .how {
      margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      font-family: "Segoe UI", sans-serif;
    }
    .how div { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: #fffcf6; }
    .how b { display: block; font-size: 12px; margin-bottom: 4px; }
    .how span { font-size: 12px; color: var(--muted); line-height: 1.45; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      aside { min-height: auto; }
      .how { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">BlockHub · 独立站</div>
      <p class="aside-title">场景导航</p>
      <p class="hint">按分类展开；点场景进入对应能力页（真 API）。</p>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main>
      <div class="topbar">
        <a class="back" href="./index.html">← 返回 5 套目录</a>
        <span>方案 01 · Editorial Tree</span>
      </div>
      <section class="hero">
        <p class="eyebrow">已选行业</p>
        <h1>通用办公</h1>
        <p>从左侧打开人事、审批、知识等场景。首页只做封面与引导，不再铺满 Tab。</p>
        <div class="cta-row">
          <button class="btn" type="button" id="goFirst">从「请假申请」开始 →</button>
          <button class="btn ghost" type="button">查看已选 66 个场景</button>
        </div>
      </section>
      <section class="panel">
        <h2>页面模板</h2>
        <p class="sub">只影响版式气质；场景与能力不变。点选即可预览。</p>
        <div class="chips" id="chips"></div>
      </section>
      <section class="how">
        <div><b>① 左侧选场景</b><span>父子级分类，避免顶栏密密麻麻。</span></div>
        <div><b>② 进入能力页</b><span>一个场景对应一个能力包，用 &gt;&gt; 逐步填表。</span></div>
        <div><b>③ 需要换皮时</b><span>用上方小芯片换模板，不改业务数据。</span></div>
      </section>
    </main>
  </div>
  <script>
    const groups = [
      { cat: '人事行政', items: ['请假申请', '加班申请', '入职办理', '离职交接'] },
      { cat: '审批协作', items: ['报销审批', '合同签署', '用章申请', '采购申请'] },
      { cat: '知识培训', items: ['SOP 手册', '培训报名', '考试测验', '制度库'] },
      { cat: '行政后勤', items: ['会议室预订', '访客登记', '固定资产', '报修工单'] },
    ];
    const templates = ['Helios', 'Landed', 'Tessellate', 'Nova', 'Hyperspace', 'Massively'];
    const nav = document.getElementById('nav');
    groups.forEach((g, i) => {
      const d = document.createElement('details');
      d.open = i === 0;
      d.innerHTML = `<summary>${g.cat}<span>${g.items.length}</span></summary>`;
      g.items.forEach((name, j) => {
        const b = document.createElement('button');
        b.className = 'child' + (i === 0 && j === 0 ? ' on' : '');
        b.type = 'button';
        b.textContent = name;
        b.onclick = () => {
          nav.querySelectorAll('.child').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
        };
        d.appendChild(b);
      });
      nav.appendChild(d);
    });
    const chips = document.getElementById('chips');
    templates.forEach((t, i) => {
      const c = document.createElement('button');
      c.className = 'chip' + (i === 3 ? ' on' : '');
      c.type = 'button';
      c.textContent = t;
      c.onclick = () => {
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
        c.classList.add('on');
      };
      chips.appendChild(c);
    });
    document.getElementById('goFirst').onclick = () => {
      nav.querySelector('.child')?.click();
      alert('原型：将进入「请假申请」能力页（正式环境走真 API + Gtgt 填表）');
    };
  </script>
</body>
</html>
