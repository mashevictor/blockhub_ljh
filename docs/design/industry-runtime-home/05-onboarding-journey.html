<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · 首次使用旅程卡</title>
  <style>
    :root {
      --bg: #eef2ff;
      --ink: #1e1b4b;
      --muted: #6366f1;
      --panel: #ffffff;
      --line: #c7d2fe;
      --accent: #4f46e5;
      --side: #312e81;
    }
    /* Note: indigo accent here is intentional for "journey card" contrast among 5 options; product impl can re-tint */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Nunito", "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    aside { background: var(--side); color: #e0e7ff; padding: 16px 12px; }
    .aside-title { font-size: 12px; opacity: .7; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
    details { border-bottom: 1px solid rgba(255,255,255,.08); padding: 6px 0; }
    summary { cursor: pointer; font-size: 12px; opacity: .8; padding: 4px 6px; }
    .child {
      display: block; width: 100%; border: 0; background: transparent; color: inherit; text-align: left;
      padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .child.on, .child:hover { background: rgba(255,255,255,.1); }
    main { padding: 20px 24px 60px; position: relative; }
    .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 16px; }
    .top a { color: var(--accent); text-decoration: none; }
    .hero {
      background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
      padding: 36px 32px; margin-bottom: 14px;
      box-shadow: 0 20px 50px rgba(79,70,229,.08);
    }
    .hero .k { margin: 0 0 8px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .hero h1 { margin: 0; font-size: clamp(40px, 6vw, 60px); letter-spacing: -.03em; }
    .hero p { margin: 12px 0 0; color: #64748b; max-width: 46ch; line-height: 1.55; font-size: 14px; }
    .rec {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 12px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
    }
    .card h2 { margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 0 0 12px; font-size: 13px; color: #64748b; line-height: 1.45; }
    .next {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      background: #eef2ff; border-radius: 14px; padding: 12px 14px;
    }
    .next strong { display: block; font-size: 14px; }
    .next small { color: #64748b; }
    .btn {
      border: 0; background: var(--accent); color: #fff; border-radius: 999px;
      padding: 10px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .tpl { display: flex; gap: 6px; flex-wrap: wrap; }
    .tpl button {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 5px 9px; font-size: 11px; color: #64748b; cursor: pointer;
    }
    .tpl button.on { border-color: var(--accent); color: var(--accent); background: #eef2ff; }
    /* first-run overlay */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: grid; place-items: center; padding: 20px; z-index: 30;
    }
    .overlay.hidden { display: none; }
    .journey {
      width: min(520px, 100%); background: #fff; border-radius: 24px; padding: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
    }
    .journey h3 { margin: 0 0 8px; font-size: 22px; }
    .journey .lead { margin: 0 0 16px; color: #64748b; font-size: 14px; line-height: 1.5; }
    .j-steps { display: grid; gap: 8px; margin-bottom: 16px; }
    .j-steps div {
      display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
      padding: 10px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0;
    }
    .j-steps span {
      width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
    }
    .j-steps b { display: block; font-size: 13px; }
    .j-steps small { color: #64748b; font-size: 12px; }
    .j-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .rec { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="aside-title">场景导航</div>
      <div id="nav"></div>
    </aside>
    <main>
      <div class="top">
        <a href="./index.html">← 目录</a>
        <button class="btn ghost" type="button" id="replay" style="padding:6px 10px;font-size:12px">重看引导</button>
      </div>
      <section class="hero">
        <p class="k">你的行业应用</p>
        <h1>通用办公</h1>
        <p>日常首页：行业大字 + 推荐下一场景。密密麻麻的 Tab 全部收到左侧父子导航。</p>
      </section>
      <div class="rec">
        <section class="card">
          <h2>建议下一步</h2>
          <p>系统根据你已选场景，推荐最高频入口，避免面对 60+ 按钮不知从哪点。</p>
          <div class="next">
            <div>
              <strong id="recName">报修工单</strong>
              <small id="recCap">能力 device_repair · 真 API</small>
            </div>
            <button class="btn" type="button" id="go">开始 →</button>
          </div>
        </section>
        <section class="card">
          <h2>换模板</h2>
          <p>小字即可，默认收起注意力。</p>
          <div class="tpl" id="tpl"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay">
    <div class="journey">
      <h3>先这样用</h3>
      <p class="lead">这不是能力按钮墙。首页是行业封面；场景在左侧；能力在点进场景后出现。</p>
      <div class="j-steps">
        <div><span>1</span><div><b>看行业大字</b><small>确认这是「通用办公」独立站</small></div></div>
        <div><span>2</span><div><b>左侧父子导航</b><small>展开分类 → 点具体场景</small></div></div>
        <div><span>3</span><div><b>建议下一步</b><small>或点推荐卡片，直接进入能力填写</small></div></div>
      </div>
      <div class="j-actions">
        <button class="btn ghost" type="button" id="skip">跳过</button>
        <button class="btn" type="button" id="start">知道了，去试一次</button>
      </div>
    </div>
  </div>

  <script>
    const groups = [
      { cat: '人事行政', items: ['请假申请','加班申请','入职办理'] },
      { cat: '审批协作', items: ['报销审批','合同签署'] },
      { cat: '行政后勤', items: ['报修工单','会议室预订','访客登记'] },
    ];
    const map = { '报修工单': 'device_repair', '请假申请': 'approval_flow', '会议室预订': 'meeting_booking', '报销审批': 'expense' };
    const nav = document.getElementById('nav');
    groups.forEach((g, i) => {
      const d = document.createElement('details');
      d.open = i === 2;
      d.innerHTML = `<summary>${g.cat}</summary>`;
      g.items.forEach(name => {
        const b = document.createElement('button');
        b.className = 'child' + (name === '报修工单' ? ' on' : '');
        b.type = 'button';
        b.textContent = name;
        b.onclick = () => {
          nav.querySelectorAll('.child').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
          document.getElementById('recName').textContent = name;
          document.getElementById('recCap').textContent = `能力 ${map[name] || 'capability'} · 真 API`;
        };
        d.appendChild(b);
      });
      nav.appendChild(d);
    });
    const overlay = document.getElementById('overlay');
    const hide = () => overlay.classList.add('hidden');
    document.getElementById('skip').onclick = hide;
    document.getElementById('start').onclick = () => { hide(); document.getElementById('go').focus(); };
    document.getElementById('replay').onclick = () => overlay.classList.remove('hidden');
    document.getElementById('go').onclick = () => alert('原型：进入「' + document.getElementById('recName').textContent + '」');
    const tpl = document.getElementById('tpl');
    ['Hyperspace','Nova','Tessellate','Helios'].forEach((t,i) => {
      const b = document.createElement('button');
      b.textContent = t;
      if (i===0) b.className='on';
      b.onclick = () => { [...tpl.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      tpl.appendChild(b);
    });
  </script>
</body>
</html>
